name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    uses: Project-Navi/.github/.github/workflows/_build-reusable.yml@83f5a6860e88af77ecebda9d90836c6e7caec159
    with:
      tag_name: ${{ github.ref_name }}
      package_name: navi_bootstrap
    permissions:
      contents: write
      id-token: write
      attestations: write

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: dist/
