name: Grippy Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: grippy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Grippy Code Review
    # Skip (a) fork PRs and (b) bot-authored PRs. Both categories are
    # denied access to Actions secrets by GitHub, so OPENAI_API_KEY is
    # unavailable and Grippy cannot run.
    #
    # Using github.event.pull_request.user.* rather than github.actor:
    # the PR author is stable across pushes, re-runs, and maintainer
    # commits onto the branch, whereas github.actor reflects whoever
    # triggered the current run.
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && github.event.pull_request.user.type != 'Bot'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Grippy
        run: pip install "grippy-code-review[persistence] @ git+https://github.com/Project-Navi/grippy-code-review.git@19f078e42e7b8bee38a990ccf03236ea44ae2d71"

      - name: Run review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRIPPY_TRANSPORT: openai
          GRIPPY_MODEL_ID: gpt-4.1
          GRIPPY_EMBEDDING_MODEL: text-embedding-3-large
          GRIPPY_DATA_DIR: ./grippy-data
          GRIPPY_TIMEOUT: 300
        run: python -I -m grippy
